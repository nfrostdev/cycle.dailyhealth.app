<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>Cycle - Private Period Tracker | Your Data Stays on Your Device</title>
  <meta name="title" content="Cycle - Private Period Tracker | Your Data Stays on Your Device">
  <meta name="description" content="A private, offline-first period tracker. No accounts, no cloud, no data collection. Your cycle data never leaves your device. Simple, beautiful, and completely yours.">
  <meta name="keywords" content="private period tracker, offline period tracker, no account period app, secure menstrual tracker, privacy period calendar, local-only cycle tracker, anonymous period tracker">
  <meta name="author" content="Cycle App">
  <meta name="robots" content="index, follow">
  <meta name="language" content="English">

  <!-- Theme & App Config -->
  <meta name="theme-color" content="#f43f5e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cycle">
  <meta name="application-name" content="Cycle">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cycle.dailyhealth.app/">
  <meta property="og:title" content="Cycle - Private Period Tracker | Your Data Stays on Your Device">
  <meta property="og:description" content="A private, offline-first period tracker. No accounts, no cloud, no data collection. Your cycle data never leaves your device.">
  <meta property="og:image" content="https://cycle.dailyhealth.app/icons/icon-512.png">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="Cycle">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Cycle - Private Period Tracker | Your Data Stays on Your Device">
  <meta name="twitter:description" content="A private, offline-first period tracker. No accounts, no cloud, no data collection. Your cycle data never leaves your device.">
  <meta name="twitter:image" content="https://cycle.dailyhealth.app/icons/icon-512.png">

  <!-- Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Cycle",
      "description": "A private, offline-first period tracker. No accounts, no cloud, no data collection. Your cycle data never leaves your device.",
      "url": "https://cycle.dailyhealth.app/",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "100% private - data never leaves your device",
        "No account required",
        "No cloud storage",
        "Works completely offline"
      ]
    }
  </script>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://cycle.dailyhealth.app/">

  <!-- Preconnect & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['Fraunces', 'serif'],
            body: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      /* Phase-specific accent colors using Tailwind palette */
      --phase-accent-light: #e11d48; /* rose-600 */
      --phase-accent-dark: #fb7185; /* rose-400 */
      --phase-gradient-from: #f43f5e; /* rose-500 */
      --phase-gradient-to: #e11d48; /* rose-600 */
      --phase-bg-light: #fff1f2; /* rose-50 */
      --phase-bg-dark: #1c1917; /* stone-900 */
      --phase-card-border: #fecdd3; /* rose-200 */
      --phase-card-bg: rgba(255, 241, 242, 0.5); /* rose-50/50 */
      --phase-glow: rgba(244, 63, 94, 0.3); /* rose-500/30 */
    }

    .phase-menstrual {
      --phase-accent-light: #e11d48;
      --phase-accent-dark: #fb7185;
      --phase-gradient-from: #f43f5e;
      --phase-gradient-to: #e11d48;
      --phase-bg-light: #fff1f2;
      --phase-card-border: #fecdd3;
      --phase-card-bg: rgba(255, 241, 242, 0.6);
      --phase-glow: rgba(244, 63, 94, 0.25);
      --phase-marker: #f43f5e;
    }

    .phase-follicular {
      --phase-accent-light: #d97706;
      --phase-accent-dark: #fbbf24;
      --phase-gradient-from: #f59e0b;
      --phase-gradient-to: #d97706;
      --phase-bg-light: #fffbeb;
      --phase-card-border: #fde68a;
      --phase-card-bg: rgba(255, 251, 235, 0.6);
      --phase-glow: rgba(245, 158, 11, 0.25);
      --phase-marker: #f59e0b;
    }

    .phase-ovulation {
      --phase-accent-light: #059669;
      --phase-accent-dark: #34d399;
      --phase-gradient-from: #10b981;
      --phase-gradient-to: #059669;
      --phase-bg-light: #ecfdf5;
      --phase-card-border: #a7f3d0;
      --phase-card-bg: rgba(236, 253, 245, 0.6);
      --phase-glow: rgba(16, 185, 129, 0.25);
      --phase-marker: #10b981;
    }

    .phase-luteal-early {
      --phase-accent-light: #0284c7;
      --phase-accent-dark: #38bdf8;
      --phase-gradient-from: #0ea5e9;
      --phase-gradient-to: #0284c7;
      --phase-bg-light: #f0f9ff;
      --phase-card-border: #bae6fd;
      --phase-card-bg: rgba(240, 249, 255, 0.6);
      --phase-glow: rgba(14, 165, 233, 0.25);
      --phase-marker: #0ea5e9;
    }

    .phase-luteal-late {
      --phase-accent-light: #7c3aed;
      --phase-accent-dark: #a78bfa;
      --phase-gradient-from: #8b5cf6;
      --phase-gradient-to: #7c3aed;
      --phase-bg-light: #f5f3ff;
      --phase-card-border: #ddd6fe;
      --phase-card-bg: rgba(245, 243, 255, 0.6);
      --phase-glow: rgba(139, 92, 246, 0.25);
      --phase-marker: #8b5cf6;
    }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      transition: background-color 0.5s ease;
    }

    .font-display {
      font-family: 'Fraunces', serif;
    }

    /* Phase-tinted card */
    .phase-card {
      background: var(--phase-card-bg);
      border: 1px solid var(--phase-card-border);
    }

    .dark .phase-card {
      background: rgba(41, 37, 36, 0.8);
      border-color: rgba(68, 64, 60, 0.8);
    }

    /* Phase glow for circle */
    .phase-glow {
      box-shadow:
              0 0 20px var(--phase-glow),
              0 8px 30px rgba(0, 0, 0, 0.1);
    }

    .dark .phase-glow {
      box-shadow:
              0 0 25px var(--phase-glow),
              0 0 50px var(--phase-glow);
    }

    /* Phase-aware text accent — light mode uses accent-light, dark mode uses accent-dark
       so contrast meets WCAG AA (4.5:1) against both background tones */
    .phase-text-accent {
      color: var(--phase-accent-light);
    }
    .dark .phase-text-accent {
      color: var(--phase-accent-dark);
    }

    /* Focus states for accessibility */
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--phase-accent-light);
      outline-offset: 2px;
    }

    .dark button:focus-visible,
    .dark input:focus-visible {
      outline-color: var(--phase-accent-dark);
    }
  </style>
</head>
<body class="min-h-screen text-stone-700 dark:text-stone-200" style="background-color: var(--phase-bg-light);">
<div class="dark:hidden fixed inset-0 -z-10" style="background: linear-gradient(to bottom, var(--phase-bg-light), white);"></div>
<div class="hidden dark:block fixed inset-0 -z-10 bg-stone-900"></div>

<div id="app" class="max-w-md mx-auto px-5 py-8 min-h-screen">
  <!-- App content will be rendered here -->
  <div class="text-center py-20">
    <p class="text-warm-light">Loading...</p>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
